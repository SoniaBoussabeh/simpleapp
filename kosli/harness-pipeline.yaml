# Harness pipeline "Testkosli" (clone of App2) with Kosli steps added.
#
# Added steps are marked  # <-- KOSLI.  Existing steps are unchanged.
#
# PREREQUISITE: kosli/ must be committed and pushed to main before running this.
# The Kosli Begin Trail step reads /harness/test/kosli/flow-template.yml from the
# GitClone, which clones branch main. If it isn't pushed, that step fails.
#
# Read kosli/HARNESS-NOTES.md first — there are two problems inherited from the
# original pipeline, one of which makes the dashboard flap red on every build.
pipeline:
  projectIdentifier: foodtrucksre
  orgIdentifier: default
  stages:
    - stage:
        name: Build
        identifier: Build
        type: CI
        spec:
          cloneCodebase: false
          execution:
            steps:
              - step:
                  type: Run
                  name: Echo Welcome Message
                  identifier: Echo_Welcome_Message
                  spec:
                    connectorRef: account.dockerio
                    image: alpine:latest
                    shell: Sh
                    command: echo "Welcome to Harness CI"

              - step:
                  type: GitClone
                  name: GitClone_1
                  identifier: GitClone_1
                  spec:
                    connectorRef: account.githubsonia
                    repoName: simpleapp
                    cloneDirectory: /harness/test
                    build:
                      type: branch
                      spec:
                        branch: main

              # <-- KOSLI: install the CLI into the shared /harness volume and
              # capture the commit SHA. Needed because cloneCodebase is false, so
              # <+codebase.commitSha> is not available in this pipeline.
              - step:
                  type: Run
                  name: Kosli Setup
                  identifier: Kosli_Setup
                  spec:
                    connectorRef: account.dockerio
                    image: alpine/git:latest
                    shell: Sh
                    command: |-
                      set -eu
                      KOSLI_VERSION=2.36.1
                      apk add --no-cache curl >/dev/null
                      mkdir -p /harness/bin
                      tmp=$(mktemp -d)
                      curl -fsSL "https://github.com/kosli-dev/cli/releases/download/v${KOSLI_VERSION}/kosli_${KOSLI_VERSION}_linux_amd64.tar.gz" | tar -xz -C "$tmp"
                      mv "$tmp/kosli" /harness/bin/kosli
                      chmod +x /harness/bin/kosli
                      # fails loudly here rather than mysteriously three steps later
                      /harness/bin/kosli version
                      export COMMIT_SHA=$(git -C /harness/test rev-parse HEAD)
                      echo "commit sha: $COMMIT_SHA"
                    outputVariables:
                      - name: COMMIT_SHA

              - step:
                  type: Run
                  name: Read Version
                  identifier: Read_Version
                  spec:
                    connectorRef: account.dockerio
                    image: alpine:latest
                    shell: Sh
                    command: |-
                      export APP_VERSION=$(tr -d ' \t\r\n' < /harness/test/VERSION)
                      echo "App version: $APP_VERSION"
                    outputVariables:
                      - name: APP_VERSION

              # <-- KOSLI: create/update the flow from the versioned template, then
              # open a trail for this commit. `create flow` is idempotent, so the
              # template in git stays the single source of truth.
              - step:
                  type: Run
                  name: Kosli Begin Trail
                  identifier: Kosli_Begin_Trail
                  spec:
                    connectorRef: account.dockerio
                    image: alpine:latest
                    shell: Sh
                    envVariables:
                      KOSLI_API_TOKEN: <+secrets.getValue("account.kosli_api_token")>
                      KOSLI_ORG: SDL-Sandbox
                      KOSLI_FLOW: simple-app
                    command: |-
                      set -eu
                      SHA=<+execution.steps.Kosli_Setup.output.outputVariables.COMMIT_SHA>
                      /harness/bin/kosli create flow simple-app \
                        --description "simple-app delivery process" \
                        --template-file /harness/test/kosli/flow-template.yml
                      /harness/bin/kosli begin trail "$SHA" \
                        --commit "$SHA" \
                        --repo-root /harness/test \
                        --repo-provider github \
                        --repository "SoniaBoussabeh/simpleapp" \
                        --repo-url "https://github.com/SoniaBoussabeh/simpleapp" \
                        --repo-id "1269630228" \
                        --description "simple-app build <+pipeline.sequenceId>"

              - step:
                  type: BuildAndPushDockerRegistry
                  name: BuildAndPushDockerRegistry_1
                  identifier: BuildAndPushDockerRegistry_1
                  spec:
                    connectorRef: account.dockerio
                    repo: soniabou/simpleapp
                    tags:
                      - <+execution.steps.Read_Version.output.outputVariables.APP_VERSION>
                      - latest
                    buildArgs:
                      APP_VERSION: <+execution.steps.Read_Version.output.outputVariables.APP_VERSION>
                    context: /harness/test
                    dockerfile: /harness/test/Dockerfile

              # <-- KOSLI: must run AFTER the push. --artifact-type oci resolves the
              # real sha256 digest from Docker Hub; that digest is the only thing the
              # cluster reporter can see, so it is the join key.
              - step:
                  type: Run
                  name: Kosli Attest Artifact
                  identifier: Kosli_Attest_Artifact
                  spec:
                    connectorRef: account.dockerio
                    image: alpine:latest
                    shell: Sh
                    envVariables:
                      KOSLI_API_TOKEN: <+secrets.getValue("account.kosli_api_token")>
                      KOSLI_ORG: SDL-Sandbox
                      KOSLI_FLOW: simple-app
                    command: |-
                      set -eu
                      SHA=<+execution.steps.Kosli_Setup.output.outputVariables.COMMIT_SHA>
                      VER=<+execution.steps.Read_Version.output.outputVariables.APP_VERSION>
                      /harness/bin/kosli attest artifact "docker.io/soniabou/simpleapp:${VER}" \
                        --artifact-type oci \
                        --name simple-app \
                        --trail "$SHA" \
                        --commit "$SHA" \
                        --commit-url "https://github.com/SoniaBoussabeh/simpleapp/commit/${SHA}" \
                        --build-url "<+pipeline.executionUrl>" \
                        --repo-root /harness/test

              # <-- KOSLI: the only step that calls the GitHub API. Satisfies the
              # `pull-request` attestation in flow-template.yml.
              # Swap `attest` for `assert` to FAIL the build when no approved PR exists.
              - step:
                  type: Run
                  name: Kosli Attest Pull Request
                  identifier: Kosli_Attest_PullRequest
                  spec:
                    connectorRef: account.dockerio
                    image: alpine:latest
                    shell: Sh
                    envVariables:
                      KOSLI_API_TOKEN: <+secrets.getValue("account.kosli_api_token")>
                      KOSLI_ORG: SDL-Sandbox
                      KOSLI_FLOW: simple-app
                      KOSLI_GITHUB_TOKEN: <+secrets.getValue("account.github_token")>
                    command: |-
                      set -eu
                      SHA=<+execution.steps.Kosli_Setup.output.outputVariables.COMMIT_SHA>
                      # NOTE: this subcommand takes --origin-url, NOT --build-url.
                      # --repo-root is required so it can read the local clone.
                      /harness/bin/kosli attest pullrequest github \
                        --name pull-request \
                        --github-org SoniaBoussabeh \
                        --repository simpleapp \
                        --trail "$SHA" \
                        --commit "$SHA" \
                        --repo-root /harness/test \
                        --origin-url "<+pipeline.executionUrl>"

              # <-- KOSLI: records a DECISION against control RCTL-043-test
              # ("Source code review"). Controls receive decisions; there is no
              # `kosli attest control`, and `attest pullrequest` has no --control
              # flag, so this must be its own step.
              #
              # The verdict is DERIVED, not hardcoded. A control that always reports
              # compliant is a rubber stamp — audit evidence that proves nothing,
              # which is worse than having no control at all.
              #
              # It queries the GitHub API directly rather than using
              # `kosli assert pullrequest github`, which is the obvious choice but
              # the wrong one — verified 2026-08-13. That command asserts only that
              # a pull request EXISTS for the commit; it says nothing about
              # approvals. RCTL-043-test requires review by a SECOND developer, so a
              # self-merged PR must fail, and `assert` would pass it.
              # It also rejects --repo-root (valid on `attest pullrequest`, not on
              # `assert`), exiting non-zero before ever reaching GitHub — which
              # recorded compliant=false on every run regardless of the PR.
              - step:
                  type: Run
                  name: Kosli Attest Decision RCTL-043-test
                  identifier: Kosli_Attest_Decision_RCTL043
                  spec:
                    connectorRef: account.dockerio
                    image: alpine:latest
                    shell: Sh
                    envVariables:
                      KOSLI_API_TOKEN: <+secrets.getValue("account.kosli_api_token")>
                      KOSLI_ORG: SDL-Sandbox
                      KOSLI_FLOW: simple-app
                      KOSLI_GITHUB_TOKEN: <+secrets.getValue("account.github_token")>
                    command: |-
                      # `set -u` only, NOT `set -eu`: a non-compliant verdict must
                      # still reach Kosli. `-e` would abort the step first and the
                      # violation would go UNREPORTED rather than red.
                      set -u
                      apk add --no-cache curl jq >/dev/null

                      SHA=<+execution.steps.Kosli_Setup.output.outputVariables.COMMIT_SHA>
                      API="https://api.github.com/repos/SoniaBoussabeh/simpleapp"
                      AUTH="Authorization: Bearer $KOSLI_GITHUB_TOKEN"
                      ACCEPT="Accept: application/vnd.github+json"

                      # Initialise for `set -u`: the no-PR branch leaves these unset.
                      PR=""; AUTHOR=""; APPROVERS=""

                      # If GitHub itself is unreachable or the token is bad, FAIL THE
                      # STEP. A check that could not run must never be recorded as a
                      # governance verdict — that is how "broken token" silently
                      # becomes "developer skipped review" in an audit.
                      PRS=$(curl -sSf -H "$AUTH" -H "$ACCEPT" "$API/commits/$SHA/pulls") || {
                        echo "ERROR: GitHub API call failed. Check KOSLI_GITHUB_TOKEN and its repo scope."
                        exit 1
                      }
                      PR=$(printf '%s' "$PRS" | jq -r '.[0].number // empty')

                      if [ -z "$PR" ]; then
                        COMPLIANT=false
                        REASON="No pull request found for commit $SHA - the change reached main without review."
                      else
                        AUTHOR=$(curl -sSf -H "$AUTH" -H "$ACCEPT" "$API/pulls/$PR" | jq -r '.user.login')
                        REVIEWS=$(curl -sSf -H "$AUTH" -H "$ACCEPT" "$API/pulls/$PR/reviews?per_page=100")
                        # Self-approval does not satisfy "a SECOND developer", so the
                        # PR author is excluded. GitHub blocks self-approval via the
                        # UI, but excluding explicitly keeps the rule self-evident.
                        APPROVERS=$(printf '%s' "$REVIEWS" | jq -r --arg a "$AUTHOR" \
                          '[.[] | select(.state=="APPROVED") | select(.user.login != $a) | .user.login] | unique | join(", ")')
                        if [ -n "$APPROVERS" ]; then
                          COMPLIANT=true
                          REASON="PR #$PR (author: $AUTHOR) approved by: $APPROVERS"
                        else
                          COMPLIANT=false
                          REASON="PR #$PR (author: $AUTHOR) has no APPROVED review from anyone other than the author."
                        fi
                      fi

                      # Written to a file so the verdict's REASON becomes durable
                      # evidence in Kosli, not just a line in a Harness log that
                      # ages out.
                      {
                        echo "Control:   RCTL-043-test - Source code review"
                        echo "Commit:    $SHA"
                        echo "Compliant: $COMPLIANT"
                        echo "Reason:    $REASON"
                      } > /harness/rctl-043-evidence.txt
                      cat /harness/rctl-043-evidence.txt

                      printf '{"control":"RCTL-043-test","pull_request":"%s","author":"%s","approvers":"%s","compliant":%s}\n' \
                        "$PR" "$AUTHOR" "$APPROVERS" "$COMPLIANT" > /harness/rctl-043-userdata.json

                      # NOTE: --compliant is a bool flag, so it MUST use the
                      # `--compliant=$X` form. `--compliant $X` does not parse.
                      # It is also [defaulted] — omit it and Kosli records a
                      # compliant decision by itself. Always pass it explicitly.
                      #
                      # This command has NO --build-url / --commit-url (unlike
                      # `attest artifact`); passing them fails with unknown flag.
                      #
                      # --repo-id/--repo-url/--repository are auto-set only in
                      # GitHub Actions, GitLab, Bitbucket and Azure DevOps. Harness
                      # is not on that list, so set all three explicitly or none of
                      # the repo metadata is recorded.
                      /harness/bin/kosli attest decision \
                        --name source-code-review-decision \
                        --control RCTL-043-test \
                        --compliant="$COMPLIANT" \
                        --description "$REASON" \
                        --attachments /harness/rctl-043-evidence.txt \
                        --user-data /harness/rctl-043-userdata.json \
                        --trail "$SHA" \
                        --commit "$SHA" \
                        --repo-root /harness/test \
                        --repo-provider github \
                        --repository "SoniaBoussabeh/simpleapp" \
                        --repo-url "https://github.com/SoniaBoussabeh/simpleapp" \
                        --repo-id "1269630228" \
                        --origin-url "<+pipeline.executionUrl>"

          infrastructure:
            type: KubernetesDirect
            spec:
              connectorRef: account.SRETrainingCluster
              # CHANGED: was `simple-app`, which is the namespace the app runs in and
              # the namespace the Kosli reporter is scoped to. CI pods landing there
              # get reported as unprovenanced artifacts and flip simple-app-prod to
              # NON-COMPLIANT during every build. See kosli/HARNESS-NOTES.md.
              namespace: harness-ci
              automountServiceAccountToken: true
              nodeSelector: {}
              os: Linux

    - stage:
        name: Deploy
        identifier: Deploy
        type: Deployment
        spec:
          deploymentType: Kubernetes
          service:
            serviceRef: simpleapp
            serviceInputs:
              serviceDefinition:
                type: Kubernetes
                spec:
                  artifacts:
                    primary:
                      sources:
                        - identifier: dockerimage
                          type: DockerRegistry
                          spec:
                            tag: <+pipeline.stages.Build.spec.execution.steps.Read_Version.output.outputVariables.APP_VERSION>
          environment:
            environmentRef: prod_Env
            deployToAll: false
            infrastructureDefinitions:
              - identifier: simpleappinfra
          execution:
            steps:
              - step:
                  type: Policy
                  name: Pre-Deploy Version Check
                  identifier: PreDeployVersionCheck
                  spec:
                    policySets:
                      - devprod
                    type: Custom
                    policySpec:
                      payload: "{\"version\": \"<+pipeline.stages.Build.spec.execution.steps.Read_Version.output.outputVariables.APP_VERSION>\"}"
                  timeout: 10m
              - step:
                  type: K8sRollingDeploy
                  name: Rolling Deployment
                  identifier: RollingDeployment
                  spec:
                    skipDryRun: false
                    pruningEnabled: false
                  timeout: 10m
            rollbackSteps:
              - step:
                  type: K8sRollingRollback
                  name: Rolling Rollback
                  identifier: RollingRollback
                  spec:
                    pruningEnabled: false
                  timeout: 10m
        tags: {}
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback
  allowStageExecutions: true
  tags: {}
  # Targeting the cloned test pipeline. To apply the same steps to App2 later,
  # change these two lines back to App2 — nothing else differs.
  identifier: Testkosli
  name: Testkosli
